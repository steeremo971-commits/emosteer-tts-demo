<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmoSteer-TTS Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 48px 20px 16px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
  }
  .header .subtitle {
    font-size: 1rem;
    color: #888;
    margin-top: 8px;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
  }
  .header .venue {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 14px;
    background: rgba(99,102,241,0.15);
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 20px;
    font-size: 0.8rem;
    color: #818cf8;
  }

  /* Prompt */
  .prompt {
    text-align: center;
    margin: 36px 0 24px;
    font-size: 1.05rem;
    color: #aaa;
  }

  /* Character Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
    max-width: 800px;
    margin: 0 auto;
    padding: 0 24px 60px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: #1a1a2e;
    border: 2px solid #2a2a3e;
    border-radius: 16px;
    padding: 20px 12px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .card:hover {
    border-color: #6366f1;
    background: #1e1e35;
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(99,102,241,0.15);
  }

  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #2a2a3e;
    margin: 0 auto 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    color: #555;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card .name {
    font-size: 0.9rem;
    font-weight: 600;
    color: #ddd;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .source {
    font-size: 0.72rem;
    color: #666;
    margin-top: 4px;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 24px;
    color: #555;
    font-size: 0.78rem;
    border-top: 1px solid #1a1a2e;
  }
</style>
</head>
<body>

<div class="header">
  <h1>EmoSteer-TTS</h1>
  <p class="subtitle">
    Emotion-Steered Text-to-Speech via Activation Engineering
  </p>
  <span class="venue">Interspeech 2025</span>
</div>

<p class="prompt">Select a character to start the conversation</p>

<div class="grid" id="charGrid"></div>

<div class="footer">
  Anonymous submission &mdash; Interspeech 2025
</div>

<script>
// ── Character data (fill in after top-10 selection) ──────────────────
// Each entry: { id, name, source, avatar }
// avatar: path to image in avatars/, or null for placeholder
const CHARACTERS = [
  { id: "role_01", name: "Character 1",  source: "", avatar: null },
  { id: "role_02", name: "Character 2",  source: "", avatar: null },
  { id: "role_03", name: "Character 3",  source: "", avatar: null },
  { id: "role_04", name: "Character 4",  source: "", avatar: null },
  { id: "role_05", name: "Character 5",  source: "", avatar: null },
  { id: "role_06", name: "Character 6",  source: "", avatar: null },
  { id: "role_07", name: "Character 7",  source: "", avatar: null },
  { id: "role_08", name: "Character 8",  source: "", avatar: null },
  { id: "role_09", name: "Character 9",  source: "", avatar: null },
  { id: "role_10", name: "Character 10", source: "", avatar: null },
];

// ── Render grid ──────────────────────────────────────────────────────
const grid = document.getElementById("charGrid");

CHARACTERS.forEach(ch => {
  const card = document.createElement("div");
  card.className = "card";
  card.onclick = () => {
    window.location.href = `chat.html?role=${encodeURIComponent(ch.id)}`;
  };

  const avatarInner = ch.avatar
    ? `<img src="avatars/${ch.avatar}" alt="${ch.name}">`
    : "?";

  card.innerHTML = `
    <div class="avatar">${avatarInner}</div>
    <div class="name">${ch.name}</div>
    ${ch.source ? `<div class="source">${ch.source}</div>` : ""}
  `;
  grid.appendChild(card);
});
</script>

</body>
</html>
